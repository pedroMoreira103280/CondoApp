{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block titulo %}{% endblock %} · CondoApp</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c9cff'/%3E%3Cpath d='M10 24V9h9v15M19 14h4v10M7 24h18' fill='none' stroke='%230e1116' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>
  <header class="topo">
    <div class="topo-interno">
      <a class="marca" href="{% url 'chamado_lista' %}">
        <span class="marca-icone" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4h9v17"/><path d="M15 10h3v11"/><path d="M3 21h18"/><path d="M9 8h3M9 12h3M9 16h3"/></svg>
        </span>
        CondoApp
      </a>
      {% with pagina=request.resolver_match.url_name %}
      <nav class="menu" aria-label="Principal">
        <a href="{% url 'chamado_lista' %}"{% if pagina in "chamado_lista chamado_detalhe" %} aria-current="page"{% endif %}>Chamados</a>
        <a href="{% url 'condominio_lista' %}"{% if pagina in "condominio_lista condominio_novo" %} aria-current="page"{% endif %}>Condomínios</a>
        <a class="botao botao-primario" href="{% url 'chamado_novo' %}">Abrir chamado</a>
      </nav>
      {% endwith %}
    </div>
  </header>

  <main class="conteudo">
    {% for mensagem in messages %}
      <p class="aviso">{{ mensagem }}</p>
    {% endfor %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
